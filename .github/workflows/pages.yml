name: Deploy v1, v2 and v3 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare v1, v2 and v3
        run: |
          mkdir -p _site/v2 _site/v3
          git archive 869507fb99d44555b68d85619d02e6cdd27752a5 | tar -x -C _site
          git archive 76e9d3505291afeda40cd31c3f7625d550a6bcdc index.html '*.js' styles.css assets | tar -x -C _site/v2
          cp index.html *.js styles.css _site/v3/
          cp -R assets _site/v3/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
